---
# Ref: https://github.com/pab1it0/prometheus-mcp-server
services:
  mcp:
    image: ghcr.io/pab1it0/prometheus-mcp-server:1.6.1
    restart: unless-stopped
    ports:
      - "8077:8080"
    environment:
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      PROMETHEUS_USERNAME: ${PROMETHEUS_USERNAME}
      PROMETHEUS_PASSWORD: ${PROMETHEUS_PASSWORD}
      PROMETHEUS_MCP_SERVER_TRANSPORT: http
      PROMETHEUS_MCP_BIND_HOST: 0.0.0.0
      PROMETHEUS_MCP_BIND_PORT: "8080"
      PROMETHEUS_URL_SSL_VERIFY: true
      PROMETHEUS_REQUEST_TIMEOUT: 30
      PROMETHEUS_DISABLE_LINKS: false
    healthcheck:
      disable: true
