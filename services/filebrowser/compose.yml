---
services:
  filebrowser:
    image: gtstef/filebrowser:2.1.0-stable@sha256:17de8d0ac6a6bcfd5ef9aca43d6c0aa2fd031a07d6ee9b8a3b7c6c646efe35bf
    container_name: filebrowser
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "8989:80"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/home/filebrowser/data
      - ./files:/files
    environment:
      FILEBROWSER_CONFIG: /config.yaml
