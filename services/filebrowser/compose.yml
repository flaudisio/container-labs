---
services:
  filebrowser:
    image: gtstef/filebrowser:2.1.0-beta@sha256:329dfca21dcd04d1430f9f190a719d9e9ecb0fb9a916d26a56cd631876aebaf1
    container_name: filebrowser
    restart: unless-stopped
    user: 1000:1000
    ports:
      - "8989:80"
    volumes:
      - ./config.yaml:/config.yaml:ro
      - ./data:/home/filebrowser/data
      - ./files:/files
    environment:
      FILEBROWSER_CONFIG: /config.yaml
