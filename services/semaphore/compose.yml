---
services:
  postgres-server:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    restart: unless-stopped
    volumes:
      - /srv/container-labs/semaphore/postgres-server:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  semaphore:
    image: flaudisio/semaphore-server:2.20.23@sha256:bf3e0e796aeb9a739001109d4ad861667f65d87742669643512b35decb9109a6
    restart: unless-stopped
    ports:
      - 17300:3000
    volumes:
      - /srv/container-labs/semaphore/server-config:/etc/semaphore
      - /srv/container-labs/semaphore/server-tmp:/tmp/semaphore
    environment:
      TZ: America/Sao_Paulo
      # Ref: https://semaphoreui.com/docs/reference/configuration
      SEMAPHORE_WEB_ROOT: ${SEMAPHORE_WEB_ROOT}
      SEMAPHORE_TMP_PATH: /tmp/semaphore
      SEMAPHORE_DB_DIALECT: postgres
      SEMAPHORE_DB_HOST: postgres-server
      SEMAPHORE_DB: ${POSTGRES_DB}
      SEMAPHORE_DB_USER: ${POSTGRES_USER}
      SEMAPHORE_DB_PASS: ${POSTGRES_PASSWORD}
      SEMAPHORE_DB_OPTIONS: '{"sslmode": "disable"}'
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
      SEMAPHORE_COOKIE_HASH: ${SEMAPHORE_COOKIE_HASH}
      SEMAPHORE_COOKIE_ENCRYPTION: ${SEMAPHORE_COOKIE_ENCRYPTION}
      SEMAPHORE_DEFAULT_GLOBAL_RUNNERS_MODE: prefer
      SEMAPHORE_SCHEDULE_TIMEZONE: America/Sao_Paulo
      SEMAPHORE_TELEGRAM_ALERT: "true"
      SEMAPHORE_TELEGRAM_CHAT: ${SEMAPHORE_TELEGRAM_CHAT}
      SEMAPHORE_TELEGRAM_TOKEN: ${SEMAPHORE_TELEGRAM_TOKEN}
      SEMAPHORE_AUDIT_ENABLED: "true"
      SEMAPHORE_AUDIT_INSTANCE_ID: main
      SEMAPHORE_AUDIT_RETENTION_DAYS: 7
    depends_on:
      postgres-server:
        condition: service_healthy
    networks:
      default:
        aliases:
          - semaphore.local

  runner-01:
    image: flaudisio/semaphore-runner:2.20.23-ansible-2.21@sha256:fec1a087e595dabba7cab2ed56d5a00f1d937b94cdd94ea7adeee0a2fd249f36
    restart: unless-stopped
    volumes:
      - /srv/container-labs/semaphore/runner-01-config:/etc/semaphore
      - /srv/container-labs/semaphore/runner-01-tmp:/tmp/semaphore
    environment:
      TZ: America/Sao_Paulo
      SEMAPHORE_WEB_ROOT: http://semaphore.local:3000
      SEMAPHORE_TMP_PATH: /tmp/semaphore
      SEMAPHORE_RUNNER_TOKEN: ${SEMAPHORE_RUNNER_TOKEN}
      SEMAPHORE_FORWARDED_ENV_VARS: >-
        [
          "ANSIBLE_GALAXY_SERVER_LIST",
          "ANSIBLE_GALAXY_SERVER_LOCAL_URL",
          "ANSIBLE_GALAXY_SERVER_UPSTREAM_URL"
        ]
      ANSIBLE_GALAXY_SERVER_LIST: local,upstream
      ANSIBLE_GALAXY_SERVER_LOCAL_URL: https://galaxy-proxy.home.flaudisio.cloud
      ANSIBLE_GALAXY_SERVER_UPSTREAM_URL: https://galaxy.ansible.com
    depends_on:
      - semaphore

  postgres-backups:
    image: prodrigestivill/postgres-backup-local:18-alpine@sha256:5519b121b9f3058dc6f116927f8131a6f67951542dbf2cdacfd193f42daaa7a3
    restart: unless-stopped
    user: postgres:postgres
    volumes:
      # NOTE: see the README.md file for volume setup instructions
      - /srv/container-labs/semaphore/postgres-backups:/backups
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_HOST: postgres-server
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_EXTRA_OPTS: -Z3 --schema=public --large-objects
      SCHEDULE: "5 */2 * * *"
      BACKUP_DIR: /backups
      BACKUP_ON_START: "false"
      BACKUP_KEEP_DAYS: "30"
      BACKUP_KEEP_WEEKS: "12"
      BACKUP_KEEP_MONTHS: "6"
      HEALTHCHECK_PORT: "8080"
    depends_on:
      postgres-server:
        condition: service_healthy

  # Refs:
  # - https://github.com/vremenar/semaphore-prometheus-exporter/blob/main/docker-compose.yml
  # - https://github.com/vremenar/semaphore-prometheus-exporter/#configuration-reference
  exporter:
    image: vremenar/semaphore-prometheus-exporter:1.4.0@sha256:8ee9db776dd4983224c666d18defa1d5dea6b4b444f1ecf2b0cd22e5414eac64
    restart: unless-stopped
    user: 593:593
    ports:
      - 17900:9090
    volumes:
      - /srv/container-labs/semaphore/exporter:/data
    environment:
      TZ: America/Sao_Paulo
      SEMAPHORE_URL: http://semaphore.local:3000
      SEMAPHORE_API_TOKEN: ${SEMAPHORE_EXPORTER_API_TOKEN}
      LISTEN_ADDRESS: :9090
      SCRAPE_INTERVAL: 1m
      MAX_EVENTS: "100"
      HTTP_TIMEOUT: 5s
      INSECURE_SKIP_VERIFY: "false"
      CACHE_FILE: /data/cache.json
      LOG_LEVEL: info
    depends_on:
      - semaphore

  mcp:
    image: ghcr.io/cloin/semaphore-mcp:1.0.6@sha256:feba1b701192aa2e5624294c9d461af5d5b020def7ae698be25d1eeaf1fe6fae
    restart: unless-stopped
    user: 601:601
    ports:
      - "9500:9000"
    environment:
      SEMAPHORE_URL: http://semaphore.local:3000
      SEMAPHORE_API_TOKEN: ${SEMAPHORE_MCP_API_TOKEN}
      MCP_HOST: 0.0.0.0
      MCP_PORT: "9000"
      MCP_TRANSPORT: http
      MCP_LOG_LEVEL: INFO
    depends_on:
      - semaphore
