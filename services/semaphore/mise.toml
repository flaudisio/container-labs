# Host directories for the compose stack. Ownership matches the uid each image runs as:
# 786 = semaphore server/runner, 593 = exporter, 70 = postgres (alpine).
[tasks.setup]
description = "Create the host directories with the ownership each container expects"
run = [
  "sudo install -d -m 0755 /srv/container-labs/semaphore/postgres-server",
  "sudo install -d -m 0755 -o 786 -g 786 /srv/container-labs/semaphore/server-config",
  "sudo install -d -m 0755 -o 786 -g 786 /srv/container-labs/semaphore/server-tmp",
  "sudo install -d -m 0755 -o 786 -g 786 /srv/container-labs/semaphore/runner-01-config",
  "sudo install -d -m 0755 -o 786 -g 786 /srv/container-labs/semaphore/runner-01-tmp",
  "sudo install -d -m 0755 -o 70 -g 70 /srv/container-labs/semaphore/postgres-backups",
  "sudo install -d -m 0755 -o 593 -g 593 /srv/container-labs/semaphore/exporter",
]
